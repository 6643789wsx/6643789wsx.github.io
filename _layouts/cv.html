<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: "Curriculum Vitae" }} | {{ site.title }}</title>
    <meta name="description" content="Curriculum Vitae of {{ site.title }}.{{ site.title_zh | prepend: ' (' | append: ')' }}">
    {% if site.canonical %}<link rel="canonical" href="{{ site.canonical }}cv.html"/>{% endif %}
    <script>
      (function() {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark }}?v=2" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon }}?v=2" type="image/png" />
    <script src="/assets/js/favicon-switcher.js" type="application/javascript"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
      .cv-shell { margin:0 auto; max-width:1080px; padding:2.5rem 2rem 3rem; }
      .cv-head { align-items:flex-end; display:flex; flex-wrap:wrap; gap:1.25rem; justify-content:space-between; margin-bottom:1.25rem; }
      .cv-head h1 { color:var(--heading); font-size:1.9rem; margin:0; }
      .cv-subtitle { color:var(--muted); font-family:"Ubuntu Mono", monospace; font-size:.85rem; margin:.35rem 0 0; }
      .cv-download { background:var(--link); border-radius:999px; color:#fff; font-family:"Ubuntu Mono", monospace; font-size:.8rem; padding:.62rem 1.15rem; text-decoration:none; transition:background-color .2s ease; }
      .cv-download:hover { background:var(--link-hover); color:#fff; }
      .cv-viewer-frame { background:var(--card-bg); border:1px solid var(--border); border-radius:8px; height:calc(100vh - 230px); min-height:560px; overflow:hidden; }
      .cv-viewer { border:0; display:block; height:100%; width:100%; }
      .cv-fallback { color:var(--text); padding:2rem; }
      @media screen and (max-width:720px) {
        .cv-shell { padding:1.5rem 1.25rem 2rem; }
        .cv-viewer-frame { height:72vh; min-height:420px; }
      }
    </style>
  </head>
  <body>
    <nav class="top-nav" aria-label="Primary navigation">
      <div class="top-nav-inner">
        <a class="top-nav-brand" href="/">{{ site.title }}</a>
        <div class="top-nav-links">
          <a href="/">Home</a>
          <a href="/zh/">中文</a>
          <a href="/assets/files/cv.pdf" download>Download PDF</a>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="{{ site.title }} CV theme" title="切换深色 / 浅色模式">
            <i class="fa-solid fa-moon" id="theme-toggle-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </nav>
    <main class="cv-shell">
      {{ content }}
    </main>
    <script src="/assets/js/theme-toggle.js"></script>
  </body>
</html>
